name: park_ui
description: "Park UI - 独立、可插拔的 Flutter UI 组件集。提供 100+ 个自定义控件和完整的设计令牌系统，覆盖基础/输入/导航/展示/反馈/表单六大类。"
version: 0.2.0
publish_to: 'none'

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  equatable: ^2.0.7
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

repository: https://github.com/xihuannioyj/ParkUI
homepage: https://github.com/xihuannioyj/ParkUI
issue_tracker: https://github.com/xihuannioyj/ParkUI/issues
